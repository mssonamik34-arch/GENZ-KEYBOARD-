<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gen Z Keyboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="keyboard-container">
        <!-- সাজেশন বার (এখানে Gen Z স্লাং দেখাবে) -->
        <div class="suggestion-bar" id="suggestionBar">
            <span>no cap</span>
            <span>rizz</span>
            <span>gyatt</span>
            <span>skibidi</span>
        </div>

        <!-- ইনপুট প্রিভিউ বক্স -->
        <input type="text" id="typeBox" placeholder="Type something, bestie..." />

        <!-- কিবোর্ড লেআউট -->
        <div class="keyboard-row">
            <button class="key yellow">q</button>
            <button class="key blue">w</button>
            <button class="key dark">e</button>
            <button class="key white">r</button>
            <button class="key red">t</button>
            <button class="key blue">y</button>
            <button class="key white">u</button>
            <button class="key red">i</button>
            <button class="key yellow">o</button>
            <button class="key dark">p</button>
        </div>
        <div class="keyboard-row">
            <button class="key white">a</button>
            <button class="key red">s</button>
            <button class="key blue">d</button>
            <button class="key white">f</button>
            <button class="key yellow">g</button>
            <button class="key white">h</button>
            <button class="key red">j</button>
            <button class="key blue">k</button>
            <button class="key dark">l</button>
        </div>
        <div class="keyboard-row">
            <button class="key yellow">⇧</button>
            <button class="key dark">z</button>
            <button class="key yellow">x</button>
            <button class="key white">c</button>
            <button class="key red">v</button>
            <button class="key blue">b</button>
            <button class="key dark">n</button>
            <button class="key yellow">m</button>
            <button class="key white">⌫</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
